<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>SuperMac Kart</title>
<!-- inline so the game stays a self-contained folder with no extra requests -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23101620'/%3E%3Crect x='14' y='12' width='36' height='40' rx='6' fill='%23e8dcc0'/%3E%3Crect x='20' y='18' width='24' height='18' rx='3' fill='%23a9d4b8'/%3E%3Crect x='25' y='23' width='3' height='5' fill='%23143620'/%3E%3Crect x='36' y='23' width='3' height='5' fill='%23143620'/%3E%3Cpath d='M25 31q7 6 14 0' stroke='%23143620' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Crect x='22' y='42' width='20' height='3' rx='1.5' fill='%23555'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="stage">
  <canvas id="screen"></canvas>

  <!-- ============ HUD ============ -->
  <div id="hud" class="hidden">
    <div id="lapBox">
      <span class="label">LAP</span>
      <span id="lapNow">1</span><span id="lapTotal">/3</span>
    </div>

    <div id="timeBox">
      <span class="label">TIME</span>
      <span id="timeMain">0:00</span><span id="timeFrac">.00</span>
    </div>

    <div id="posBox">
      <span id="posNum">8</span><span id="posOrd">th</span>
      <div id="gapBox"><span class="gapLabel">GAP</span><span id="gapVal">--</span></div>
    </div>

    <div id="standings"></div>

    <div id="nitroBox">
      <div id="nitroBar"><div id="nitroFill"></div></div>
      <div id="nitroLabel">NITRO <span class="key">SPACE</span></div>
    </div>

    <div id="mapBox"><canvas id="minimap" width="260" height="180"></canvas></div>

    <div id="speedoBox"><canvas id="speedo" width="240" height="170"></canvas></div>

    <div id="centerMsg"></div>
    <div id="popup"></div>
  </div>

  <!-- ============ TOUCH ============ -->
  <div id="touch" class="hidden">
    <div class="tbtn" id="tLeft">◀</div>
    <div class="tbtn" id="tRight">▶</div>
    <div class="tbtn wide" id="tNitro">NITRO</div>
    <div class="tbtn" id="tBrake">BRAKE</div>
  </div>

  <!-- ============ MENUS ============ -->
  <div id="menu">
    <div id="titleScreen" class="screen">
      <div class="logo">
        <div class="logo-super">SUPER</div>
        <div class="logo-mac">MAC<span class="logo-kart">KART</span></div>
      </div>
      <p class="tagline">Eight mascots. Four circuits. One rainbow trail of nitro.</p>
      <button class="big" id="btnStart">START ENGINE</button>
      <div class="hint">Arrows / WASD &nbsp;·&nbsp; SPACE = nitro &nbsp;·&nbsp; SHIFT = drift &nbsp;·&nbsp; P = pause &nbsp;·&nbsp; M = mute</div>
    </div>

    <div id="charScreen" class="screen hidden">
      <h2>PICK YOUR MASCOT</h2>
      <div id="charGrid" class="grid"></div>
      <div id="charStats" class="stats"></div>
      <div class="row">
        <button id="btnCharBack" class="ghost">BACK</button>
        <button id="btnCharNext">NEXT</button>
      </div>
    </div>

    <div id="trackScreen" class="screen hidden">
      <h2>CHOOSE A CIRCUIT</h2>
      <div id="trackGrid" class="grid tracks"></div>
      <div class="row">
        <button id="btnTrackBack" class="ghost">BACK</button>
        <button id="btnGo">GREEN LIGHT</button>
      </div>
    </div>

    <div id="pauseScreen" class="screen hidden">
      <h2>PAUSED</h2>
      <div class="row col">
        <button id="btnResume">RESUME</button>
        <button id="btnRestart" class="ghost">RESTART RACE</button>
        <button id="btnQuit" class="ghost">QUIT TO MENU</button>
      </div>
    </div>

    <div id="resultScreen" class="screen hidden">
      <h2 id="resultTitle">FINISH</h2>
      <div id="resultBoard" class="board"></div>
      <div class="row">
        <button id="btnAgain">RACE AGAIN</button>
        <button id="btnMenu" class="ghost">MAIN MENU</button>
      </div>
    </div>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="js/util.js"></script>
<script src="js/art.js"></script>
<script src="js/tracks.js"></script>
<script src="js/world.js"></script>
<script src="js/kart.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
